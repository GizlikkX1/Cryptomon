<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cryptomon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2300b894'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='16' fill='url(%23g)'/%3E%3Cpath d='M6 22l6-6 4.5 3L26 9.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the cached theme, scale and text direction before the first
    // paint to avoid a flash; the server settings are loaded right after.
    try {
      var c = JSON.parse(localStorage.getItem("cryptomon.ui") || "{}");
      var d = document.documentElement;
      var th = c.theme || "system";
      if (th === "system") th = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      d.dataset.theme = th;
      if (c.scale) { d.dataset.scale = "fixed"; d.style.setProperty("--scale", c.scale); }
      if (c.dir) d.dir = c.dir;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00b894"/></linearGradient></defs><circle cx="16" cy="16" r="16" fill="url(#lg)"/><path d="M6 22l6-6 4.5 3L26 9.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Cryptomon</span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/" data-route="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span data-i18n="nav.dashboard"></span></a>
      <a href="#/markets" data-route="markets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span data-i18n="nav.markets"></span></a>
      <a href="#/alerts" data-route="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span data-i18n="nav.alerts"></span><em class="badge hidden" id="alertBadge"></em></a>
      <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span data-i18n="nav.settings"></span></a>
    </nav>
    <div class="spacer"></div>
    <div class="controls">
      <select id="vsSelect" aria-label="currency"></select>
      <select id="langSelect" aria-label="language"></select>
      <button class="btn icon" id="themeBtn" type="button" aria-label="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
      <div class="conn"><i class="dot waiting" id="connDot"></i><span id="connText"></span></div>
    </div>
  </header>
  <main id="view"></main>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="alertDialog"><form method="dialog" id="alertForm"></form></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
